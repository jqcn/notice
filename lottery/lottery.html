<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸运抽奖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#04070f;--panel:rgba(10,20,44,.72);--line:rgba(39,225,255,.28);--cyan:#27e1ff;--navy:#123a8c;--navy2:#0b2160;--orange:#ff8a1f;--text:#dff6ff;--dim:#7fa3bd}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
#title{font:800 clamp(22px,4.5vw,38px) Orbitron,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 18px rgba(39,225,255,.7);background:none;border:0;border-bottom:1px dashed transparent;width:min(100%,520px);outline:none}
#title:focus{border-bottom-color:var(--line)}
nav{display:flex;gap:8px}
button,input,select,textarea{font:inherit;color:var(--text)}
.btn{background:linear-gradient(180deg,var(--navy),var(--navy2));border:1px solid var(--cyan);border-radius:8px;padding:9px 16px;cursor:pointer;box-shadow:0 0 12px rgba(39,225,255,.25);transition:box-shadow .2s,transform .1s}
.btn:hover{box-shadow:0 0 22px rgba(39,225,255,.6)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.on{background:var(--cyan);color:#04121f;font-weight:700}
.btn.warn{border-color:#ff5a6e;box-shadow:0 0 12px rgba(255,90,110,.25)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;backdrop-filter:blur(6px);margin-bottom:16px}
.hud{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.hud label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim)}
input,select,textarea{background:rgba(6,16,40,.9);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:90px;resize:vertical}
.stat{margin-left:auto;display:flex;gap:22px}
.stat div{text-align:right;font-size:13px;color:var(--dim)}
.stat b{display:block;font:800 28px Orbitron,sans-serif;color:var(--orange);text-shadow:0 0 12px rgba(255,138,31,.6)}
#stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.slot{height:84px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;font-size:22px;font-weight:700;background:rgba(4,12,32,.85);color:var(--cyan);text-align:center;padding:4px 8px;overflow:hidden;word-break:break-all}
.slot.spin{box-shadow:inset 0 0 18px rgba(39,225,255,.35);animation:flick .12s infinite}
.slot.win{color:var(--orange);border-color:var(--orange);box-shadow:0 0 22px rgba(255,138,31,.55),inset 0 0 14px rgba(255,138,31,.25);text-shadow:0 0 10px rgba(255,138,31,.8);animation:pop .45s}
@keyframes flick{50%{opacity:.78}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#go{display:block;margin:0 auto;font:800 22px Orbitron,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.2em;padding:16px 56px;border-radius:50px}
#go.run{background:linear-gradient(180deg,#a3340f,#6b1d05);border-color:var(--orange);box-shadow:0 0 28px rgba(255,138,31,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:rgba(255,138,31,.12);border:1px solid rgba(255,138,31,.55);color:var(--orange);border-radius:20px;padding:4px 12px;font-size:14px}
h3{margin:0 0 6px;font-size:17px;color:var(--cyan)}
.hint{font-size:13px;color:var(--dim);margin:4px 0 10px}
.card{display:grid;grid-template-columns:1fr 90px 90px auto;gap:10px;align-items:end;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.card label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.card textarea{grid-column:1/-1;min-height:150px}
#pool{min-height:260px}
.num{font-family:Orbitron,sans-serif;color:var(--orange)}
#fx{display:block;width:100%;height:clamp(380px,56vw,480px);margin-top:16px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 50%,rgba(18,58,140,.35),rgba(4,12,32,.6))}
.hide{display:none}
@media(max-width:620px){.card{grid-template-columns:1fr 1fr}.card label:first-child{grid-column:1/-1}.stat{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="app">
<header>
  <input id="title" aria-label="活动标题" value="">
  <nav>
    <button class="btn on" data-v="draw">抽奖</button>
    <button class="btn" data-v="set">奖项设置</button>
    <button class="btn" data-v="res">获奖名单</button>
  </nav>
</header>

<section id="v-draw">
  <div class="panel">
    <div class="hud">
      <label>当前奖项<select id="sel"></select></label>
      <label>本轮抽取人数<input id="batch" type="number" min="1" value="1" style="width:110px"></label>
      <label>滚动特效<select id="fxsel"><option value="sphere">3D 名字球</option><option value="ring">三环旋转</option><option value="galaxy">银河漩涡</option><option value="warp">星际穿越</option><option value="rain">名字雨</option><option value="flash">闪烁大字</option><option value="slot">经典翻滚</option></select></label>
      <div class="stat"><div>剩余名额<b id="s-left">0</b></div><div>候选人数<b id="s-pool">0</b></div></div>
    </div>
    <canvas id="fx"></canvas>
    <div id="stage"></div>
    <button class="btn" id="go">开始抽奖</button>
    <div class="chips" id="cur-win"></div>
    <div style="margin-top:18px;text-align:center">
      <button class="btn warn" id="rs-open">重置抽奖</button>
      <div id="rs-menu" class="hide" style="margin-top:10px">
        <div class="hint">只清空中奖结果，奖项设置和名单都会保留。</div>
        <button class="btn warn" data-r="cur" data-l="重置当前奖项">重置当前奖项</button>
        <button class="btn warn" data-r="all" data-l="重置全部奖项">重置全部奖项</button>
        <button class="btn" data-r="x" data-l="取消">取消</button>
      </div>
    </div>
  </div>
</section>

<section id="v-set" class="hide">
  <div class="panel">
    <h3>配置来源</h3>
    <div class="hint" id="src"></div>
    <button class="btn" id="export">导出配置（复制 JSON）</button> <span class="hint" id="exp-msg"></span>
    <textarea id="exp" class="hide" readonly style="margin-top:10px;min-height:160px"></textarea>
  </div>
  <div class="panel">
    <h3>公共抽奖名单</h3>
    <div class="hint">每行一个姓名（也可用逗号分隔），重复姓名自动去重。当前 <b class="num" id="pool-n">0</b> 人。</div>
    <textarea id="pool" placeholder="张三&#10;李四&#10;王五"></textarea>
  </div>
  <div class="panel">
    <h3>奖项</h3>
    <div class="hint">抽奖顺序数字越小越先抽。奖项专属名单留空时使用公共名单；已中奖者不会进入后续任何奖项。</div>
    <div id="cards"></div>
    <button class="btn" id="add">＋ 添加奖项</button>
    <button class="btn warn" id="reset" style="float:right">重置全部抽奖结果</button>
  </div>
</section>

<section id="v-res" class="hide">
  <div class="panel">
    <div class="hud"><h3 style="margin:0">最终获奖名单</h3>
      <div class="stat"><div>获奖总人数<b id="r-total">0</b></div></div></div>
    <div id="res-body"></div>
    <button class="btn" id="copy" style="margin-top:14px">复制全部名单</button>
    <span class="hint" id="copy-msg"></span>
  </div>
</section>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='lottery-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.prizes)S={title:'幸运抽奖',pool:'',prizes:[
 {id:uid(),name:'三等奖',count:5,order:1,list:''},
 {id:uid(),name:'二等奖',count:2,order:2,list:''},
 {id:uid(),name:'一等奖',count:1,order:3,list:''}],winners:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

// —— 真随机：Web Crypto + 拒绝采样，无偏、不可预测 ——
function rnd(n){const m=Math.floor(4294967296/n)*n;let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=m);return x%n}
function pick(arr,k){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}

const parse=t=>[...new Set(String(t).split(/[\n,，;；]+/).map(s=>s.trim()).filter(Boolean))];
const won=()=>new Set(Object.values(S.winners).flat());
const sorted=()=>[...S.prizes].sort((a,b)=>a.order-b.order);
const got=p=>(S.winners[p.id]||[]);
const left=p=>Math.max(0,p.count-got(p).length);
const cands=p=>{const w=won();return parse(p.list.trim()?p.list:S.pool).filter(n=>!w.has(n))};

let cur=null,rolling=false,timer=null,stopping=false,fxRun=false;
const curPrize=()=>S.prizes.find(p=>p.id===cur);

// —— 视图切换 ——
document.querySelectorAll('nav .btn').forEach(b=>b.onclick=()=>{
  if(rolling)return;
  document.querySelectorAll('nav .btn').forEach(x=>x.classList.toggle('on',x===b));
  ['draw','set','res'].forEach(v=>$('#v-'+v).classList.toggle('hide',v!==b.dataset.v));
  if(b.dataset.v==='draw')renderDraw();
  if(b.dataset.v==='set')renderSet();
  if(b.dataset.v==='res')renderRes();
});

$('#title').value=S.title;
$('#title').onchange=e=>{S.title=e.target.value;save();document.title=S.title||'幸运抽奖'};
document.title=S.title||'幸运抽奖';

// —— 抽奖页 ——
function renderDraw(){
  const list=sorted();
  if(!list.find(p=>p.id===cur))cur=(list.find(p=>left(p)>0)||list[0]||{}).id;
  $('#sel').innerHTML=list.map(p=>`<option value="${p.id}"${p.id===cur?' selected':''}>${esc(p.name)}（${got(p).length}/${p.count}）</option>`).join('');
  refreshHud();
}
function refreshHud(){
  const p=curPrize();
  if(!p){$('#stage').innerHTML='';$('#s-left').textContent=0;$('#s-pool').textContent=0;$('#cur-win').innerHTML='';return}
  const l=left(p),c=cands(p).length;
  $('#s-left').textContent=l;$('#s-pool').textContent=c;fxWin=null;fxSet(cands(p));
  const b=$('#batch');b.max=Math.max(1,Math.min(l,c));
  if(!rolling){b.value=Math.max(1,Math.min(+b.value||l||1,+b.max));slots(+b.value,'？')}
  $('#cur-win').innerHTML=got(p).map(n=>`<span class="chip">${esc(n)}</span>`).join('');
  $('#go').disabled=false;
}
function slots(n,txt,cls=''){
  $('#stage').innerHTML=Array.from({length:Math.min(n,60)},()=>`<div class="slot ${cls}">${txt}</div>`).join('');
}
$('#sel').onchange=e=>{if(rolling)return;cur=e.target.value;$('#batch').value=left(curPrize())||1;refreshHud()};
$('#batch').onchange=()=>{if(!rolling)refreshHud()};

$('#go').onclick=()=>{
  const p=curPrize();if(!p)return;
  if(!rolling){
    const c=cands(p);
    if(left(p)<=0){flash('该奖项名额已抽完');return}
    if(!c.length){flash('候选名单为空，请先在“奖项设置”中添加名单');return}
    const n=Math.min(+$('#batch').value||1,left(p),c.length);
    rolling=true;$('#go').textContent='停　止';$('#go').classList.add('run');
    fxSet(c);fxRun=true;fxWin=null;
    if(mode()==='slot'){slots(n,'',' spin');const els=[...document.querySelectorAll('.slot')];
      timer=setInterval(()=>els.forEach(e=>e.textContent=c[rnd(c.length)]),55)}
    else slots(n,'？');
  }else{
    if(stopping)return;stopping=true;clearInterval(timer);fxRun=false;$('#go').textContent='抽取中…';
    const c=cands(p),n=Math.min(document.querySelectorAll('.slot').length,left(p),c.length);
    const win=pick(c,n);
    S.winners[p.id]=got(p).concat(win);save();
    const els=[...document.querySelectorAll('.slot')];
    els.forEach(e=>{e.classList.remove('spin');e.textContent='…'});
    const d=mode()==='slot'?0:1500;
    if(d)setTimeout(()=>{fxWin={w:win,title:p.name};fxWinT=performance.now()},800);
    win.forEach((name,i)=>setTimeout(()=>{els[i].textContent=name;els[i].classList.add('win');
      if(i===win.length-1){rolling=false;stopping=false;$('#go').textContent='开始抽奖';$('#go').classList.remove('run');
        $('#cur-win').innerHTML=got(p).map(n=>`<span class="chip">${esc(n)}</span>`).join('');
        $('#s-left').textContent=left(p);$('#s-pool').textContent=cands(p).length;
        fxSet(cands(p));const keep=$('#batch');keep.max=Math.max(1,Math.min(left(p),cands(p).length));
        const opt=$('#sel').querySelector(`option[value="${p.id}"]`);if(opt)opt.textContent=`${p.name}（${got(p).length}/${p.count}）`}},d+i*160));
  }
};
function flash(t){const s=$('#cur-win');s.innerHTML=`<span class="chip">${esc(t)}</span>`}

// —— 重置选择：当前奖项 / 全部奖项 ——
function closeRs(){$('#rs-menu').classList.add('hide');document.querySelectorAll('#rs-menu button').forEach(b=>{b.dataset.sure='0';b.textContent=b.dataset.l})}
$('#rs-open').onclick=()=>{if(rolling)return;const h=$('#rs-menu').classList.contains('hide');closeRs();if(h)$('#rs-menu').classList.remove('hide')};
$('#rs-menu').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const r=b.dataset.r;
  if(r==='x'){closeRs();return}
  if(b.dataset.sure!=='1'){document.querySelectorAll('#rs-menu button').forEach(x=>{x.dataset.sure='0';x.textContent=x.dataset.l});b.dataset.sure='1';b.textContent='再点一次确认';return}
  if(r==='cur'){if(cur)delete S.winners[cur]}else{S.winners={};cur=null}
  save();closeRs();renderDraw();
  const p=curPrize();if(p)$('#batch').value=left(p)||1;refreshHud();
};

// —— 设置页 ——
function renderSet(){
  $('#pool').value=S.pool;$('#pool-n').textContent=parse(S.pool).length;
  $('#cards').innerHTML=sorted().map(p=>`<div class="card" data-id="${p.id}">
   <label>奖项名称<input data-k="name" value="${esc(p.name)}"></label>
   <label>名额<input data-k="count" type="number" min="1" value="${p.count}"></label>
   <label>抽奖顺序<input data-k="order" type="number" value="${p.order}"></label>
   <button class="btn warn" data-del="${p.id}">删除</button>
   <textarea data-k="list" placeholder="该奖项专属名单（留空则使用公共名单）">${esc(p.list)}</textarea></div>`).join('')||'<div class="hint">还没有奖项，点击下方按钮添加。</div>';
}
$('#pool').oninput=e=>{S.pool=e.target.value;$('#pool-n').textContent=parse(S.pool).length;save()};
$('#cards').addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k)return;
  const p=S.prizes.find(x=>x.id===e.target.closest('.card').dataset.id);
  p[k]=(k==='count'||k==='order')?(+e.target.value||(k==='count'?1:0)):e.target.value;
  if(k==='count'&&p.count<1)p.count=1;save();
});
$('#cards').addEventListener('input',e=>{if(e.target.dataset.k==='list'){const p=S.prizes.find(x=>x.id===e.target.closest('.card').dataset.id);p.list=e.target.value;save()}});
$('#cards').addEventListener('click',e=>{
  const id=e.target.dataset.del;if(!id)return;
  if(e.target.dataset.sure!=='1'){e.target.dataset.sure='1';e.target.textContent='确认删除？';return}
  S.prizes=S.prizes.filter(p=>p.id!==id);delete S.winners[id];save();renderSet();
});
$('#add').onclick=()=>{
  const mx=S.prizes.reduce((m,p)=>Math.max(m,p.order),0);
  S.prizes.push({id:uid(),name:'新奖项',count:1,order:mx+1,list:''});save();renderSet();
};
$('#reset').onclick=e=>{
  if(e.target.dataset.sure!=='1'){e.target.dataset.sure='1';e.target.textContent='再点一次确认重置';return}
  S.winners={};save();e.target.dataset.sure='0';e.target.textContent='已重置';setTimeout(()=>e.target.textContent='重置全部抽奖结果',1500);
};

// —— 结果页 ——
// 获奖名单展示顺序：一、二、三等奖（如有）依次排前，其余奖项按抽奖顺序跟在后面
function resOrder(){const R={'一等奖':0,'二等奖':1,'三等奖':2},a=sorted(),rk=p=>R[p.name.trim()];return[...a.filter(p=>rk(p)!==undefined).sort((x,y)=>rk(x)-rk(y)),...a.filter(p=>rk(p)===undefined)]}
function renderRes(){
  const all=resOrder();let total=0;
  $('#res-body').innerHTML=all.map(p=>{const g=got(p);total+=g.length;
    return `<div style="margin-top:14px"><h3>${esc(p.name)} <span class="num">${g.length}/${p.count}</span></h3>
    <div class="chips">${g.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<span class="hint">尚未抽取</span>'}</div></div>`}).join('');
  $('#r-total').textContent=total;
}
$('#copy').onclick=()=>{
  const t=resOrder().map(p=>`【${p.name}】${got(p).join('、')||'（未抽取）'}`).join('\n');
  const done=ok=>$('#copy-msg').textContent=ok?'已复制':'复制失败，请手动选取名单';
  try{navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false))}catch(e){done(false)}
};

// —— 滚动特效：3D 名字球 / 名字雨 ——
const mode=()=>S.fx||'sphere';
const fx=$('#fx'),fc=fx.getContext('2d');
let names=[],pts=[],drops=[],warp=[],fxWin=null,fxWinT=0,fT=0,fN='？',FW=0,FH=320,spd=.004,ay=0,dpr=1;
const FONT='"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function fxSet(c){names=c.length>150?pick(c,150):c.slice();fxBuild()}
function fxSize(){dpr=Math.min(devicePixelRatio||1,2);FW=fx.clientWidth;FH=fx.clientHeight;if(!FW)return;fx.width=FW*dpr;fx.height=FH*dpr;fc.setTransform(dpr,0,0,dpr,0,0);fxBuild()}
function fxBuild(){
  const n=names.length,w=FW||600,h=FH||320;
  pts=names.map((t,i)=>{const ph=Math.acos(1-2*(i+.5)/n),th=Math.PI*(1+Math.sqrt(5))*(i+.5);return{t,x:Math.sin(ph)*Math.cos(th),y:Math.cos(ph),z:Math.sin(ph)*Math.sin(th)}});
  const rn=()=>n?names[Math.floor(Math.random()*n)]:'？';
  warp=Array.from({length:40},()=>({a:Math.random()*6.283,z:Math.random(),t:rn()}));
  const cols=Math.max(3,Math.floor(w/120));
  drops=Array.from({length:cols},(_,i)=>({x:(i+.5)*w/cols,y:Math.random()*h,v:.6+Math.random()*1.2,tr:Array.from({length:8},rn)}));
}
function fxFrame(){
  requestAnimationFrame(fxFrame);
  const m=mode();
  fx.style.display=m==='slot'?'none':'block';
  if(m==='slot'||!FW)return;
  const ROT=m==='sphere'||m==='ring'||m==='galaxy';
  const tgt=fxWin?0:fxRun?(ROT?.12:m==='warp'?6:4):(ROT?.004:1);
  spd+=(tgt-spd)*(fxWin?.2:.06);
  fc.clearRect(0,0,FW,FH);fc.textAlign='center';fc.textBaseline='middle';
  if(m==='sphere'){
    ay+=spd;
    const ax=.35+Math.sin(performance.now()/2500)*(fxRun?.25:.08),R=Math.min(FW*.4,FH*.44);
    const cy=Math.cos(ay),sy=Math.sin(ay),cx2=Math.cos(ax),sx=Math.sin(ax);
    const q=pts.map(p=>{const x1=p.x*cy+p.z*sy,z1=-p.x*sy+p.z*cy,y1=p.y*cx2-z1*sx,z2=p.y*sx+z1*cx2,k=2.2/(2.2-z2);return{t:p.t,sx:FW/2+x1*R*k,sy:FH/2+y1*R*k,z:z2}}).sort((a,b)=>a.z-b.z);
    for(const p of q){const d=(p.z+1)/2;fc.font=`700 ${Math.round(11+d*13)}px ${FONT}`;fc.globalAlpha=.15+.85*d;fc.fillStyle='#27e1ff';fc.shadowColor='#27e1ff';fc.shadowBlur=d>.75?14:0;fc.fillText(p.t,p.sx,p.sy)}
    fc.globalAlpha=1;fc.shadowBlur=0;
  }else if(m==='rain'){
    fc.font=`700 18px ${FONT}`;
    for(const d of drops){
      d.y+=d.v*spd*1.6;
      if(d.y-8*26>FH){d.y=0;d.tr=d.tr.map(()=>names.length?names[Math.floor(Math.random()*names.length)]:'？')}
      d.tr.forEach((t,k)=>{fc.globalAlpha=Math.max(0,1-k/8);fc.fillStyle=k===0?'#ffffff':'#27e1ff';fc.shadowColor='#27e1ff';fc.shadowBlur=k===0?16:0;fc.fillText(t,d.x,d.y-k*26)});
    }
    fc.globalAlpha=1;fc.shadowBlur=0;
  }else if(m==='ring'){
    ay+=spd;
    const R=Math.min(FW*.4,FH*.62),tilt=.3,nm=names.slice(0,84),it=[];
    for(let r=0;r<3;r++){const arr=nm.filter((_,i)=>i%3===r),dir=r%2?-1:1;
      arr.forEach((t,j)=>{const th=dir*ay*(1+r*.25)+6.283*j/arr.length,z=Math.sin(th)*R;
        it.push({t,x:FW/2+Math.cos(th)*R,y:FH/2+(r-1)*FH*.27+z*tilt,d:(z/R+1)/2})})}
    it.sort((a,b)=>a.d-b.d);
    for(const p of it){fc.font=`700 ${Math.round(12+p.d*14)}px ${FONT}`;fc.globalAlpha=.15+.85*p.d;fc.fillStyle='#27e1ff';fc.shadowColor='#27e1ff';fc.shadowBlur=p.d>.75?12:0;fc.fillText(p.t,p.x,p.y)}
    fc.globalAlpha=1;fc.shadowBlur=0;
  }else if(m==='galaxy'){
    ay+=spd;
    const R0=Math.min(FW*.46,FH*.9),n=names.length;
    const g=fc.createRadialGradient(FW/2,FH/2,0,FW/2,FH/2,R0*.5);g.addColorStop(0,'rgba(39,225,255,.35)');g.addColorStop(1,'rgba(39,225,255,0)');fc.fillStyle=g;fc.fillRect(0,0,FW,FH);
    names.forEach((t,i)=>{const f=(i+1)/n,r=Math.pow(f,.7)*R0,th=i*2.4+ay*(2.2-1.6*f);
      fc.font=`700 ${Math.round(18-8*f)}px ${FONT}`;fc.globalAlpha=.95-.6*f;fc.fillStyle=f<.15?'#ffffff':'#27e1ff';fc.shadowColor='#27e1ff';fc.shadowBlur=f<.4?10:0;
      fc.fillText(t,FW/2+Math.cos(th)*r,FH/2+Math.sin(th)*r*.42)});
    fc.globalAlpha=1;fc.shadowBlur=0;
  }else if(m==='warp'){
    const MR=Math.hypot(FW,FH)/2;
    for(const s of warp){
      s.z+=.004*spd;
      if(s.z>=1){s.z=0;s.a=Math.random()*6.283;s.t=names.length?names[Math.floor(Math.random()*names.length)]:'？'}
      const r=s.z*s.z*MR,cs=Math.cos(s.a),sn=Math.sin(s.a),x=FW/2+cs*r,y=FH/2+sn*r;
      if(spd>2){const r0=Math.pow(Math.max(0,s.z-.02*spd),2)*MR;fc.strokeStyle='rgba(39,225,255,'+(s.z*.7)+')';fc.lineWidth=1.5;fc.beginPath();fc.moveTo(FW/2+cs*r0,FH/2+sn*r0);fc.lineTo(x,y);fc.stroke()}
      fc.font=`700 ${Math.round(10+s.z*s.z*34)}px ${FONT}`;fc.globalAlpha=Math.min(1,s.z*1.6);fc.fillStyle='#27e1ff';fc.shadowColor='#27e1ff';fc.shadowBlur=s.z>.6?12:0;fc.fillText(s.t,x,y);
    }
    fc.globalAlpha=1;fc.shadowBlur=0;
  }else if(m==='flash'){
    const now=performance.now();
    if(!fxWin&&now-fT>(fxRun?55:1400)){fT=now;fN=names.length?names[Math.floor(Math.random()*names.length)]:'？'}
    const sz=Math.max(36,Math.min(110,FW/(Math.max(2,fN.length)*1.3)));fc.font=`800 ${Math.round(sz)}px ${FONT}`;
    if(fxRun){fc.globalAlpha=.55;fc.fillStyle='#ff8a1f';fc.fillText(fN,FW/2-Math.random()*7,FH/2);fc.fillStyle='#27e1ff';fc.fillText(fN,FW/2+Math.random()*7,FH/2+Math.random()*4-2)}
    fc.globalAlpha=1;fc.fillStyle='#e8fbff';fc.shadowColor='#27e1ff';fc.shadowBlur=26;fc.fillText(fN,FW/2,FH/2);fc.shadowBlur=0;
    fc.fillStyle='rgba(39,225,255,.12)';fc.fillRect(0,(now/6)%FH,FW,2);
  }
  if(fxWin)fxZoom();
}
// 停止后：特效暂停，中奖名单特写放大
function fxZoom(){
  const t=Math.min(1,(performance.now()-fxWinT)/450),e=1-Math.pow(1-t,3);
  fc.globalAlpha=.8*e;fc.fillStyle='#030814';fc.fillRect(0,0,FW,FH);
  const shown=fxWin.w.slice(0,60),m=shown.length,top=52;
  const cols=Math.max(1,Math.min(m,Math.ceil(Math.sqrt(m*FW/(FH-top)/1.6)))),rows=Math.ceil(m/cols);
  const cw=FW/cols,ch=(FH-top)/rows,longest=Math.max(1,...shown.map(s=>s.length));
  const sz=Math.max(14,Math.min(96,ch*.55,cw*.92/(longest*1.05)))*(.6+.4*e);
  fc.globalAlpha=e;fc.font=`700 18px ${FONT}`;fc.fillStyle='#27e1ff';fc.shadowColor='#27e1ff';fc.shadowBlur=10;
  fc.fillText(fxWin.title+' · 中奖名单',FW/2,26);
  fc.font=`800 ${Math.round(sz)}px ${FONT}`;fc.fillStyle='#ff8a1f';fc.shadowColor='#ff8a1f';fc.shadowBlur=26*e;
  shown.forEach((s,i)=>{const r=Math.floor(i/cols),c=i%cols,cnt=r===rows-1?m-r*cols:cols;
    fc.fillText(s,(cols-cnt)*cw/2+(c+.5)*cw,top+(r+.5)*ch)});
  fc.shadowBlur=0;fc.globalAlpha=.8*e;fc.strokeStyle='#ff8a1f';fc.lineWidth=2;fc.strokeRect(6,6,FW-12,FH-12);
  if(fxWin.w.length>60){fc.globalAlpha=e;fc.font=`700 14px ${FONT}`;fc.fillStyle='#ff8a1f';fc.fillText('共 '+fxWin.w.length+' 人，完整名单见下方',FW/2,FH-18)}
  fc.globalAlpha=1;
}
new ResizeObserver(fxSize).observe(fx);
$('#fxsel').value=mode();
$('#fxsel').onchange=e=>{if(rolling){e.target.value=mode();return}S.fx=e.target.value;save()};
fxSize();fxFrame();

// —— 未来感背景：粒子网络 + 网格 ——
(function(){
  const cv=$('#bg'),cx=cv.getContext('2d');let W,H,P=[];
  const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,Math.floor(W*H/18000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))};
  addEventListener('resize',rs);rs();
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function f(){
    cx.clearRect(0,0,W,H);
    const g=cx.createRadialGradient(W/2,H*.3,0,W/2,H*.3,Math.max(W,H)*.8);
    g.addColorStop(0,'rgba(18,58,140,.45)');g.addColorStop(1,'rgba(4,7,15,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.strokeStyle='rgba(39,225,255,.05)';cx.lineWidth=1;
    for(let x=0;x<W;x+=48){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
    for(let y=0;y<H;y+=48){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
    for(const p of P){if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
      cx.fillStyle='rgba(39,225,255,.8)';cx.fillRect(p.x,p.y,2,2)}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;
      if(d<14000){cx.strokeStyle=`rgba(39,225,255,${.18*(1-d/14000)})`;cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}
    if(!still)requestAnimationFrame(f)
  }
  f();
})();

// —— 同目录配置文件 lottery-data.json 优先；没有则使用浏览器本地数据 ——
function setSrc(f){$('#src').textContent=f?'已从同目录 lottery-data.json 载入，优先于浏览器本地数据。页面里的修改只保存在本浏览器，刷新后仍以该文件为准，要长期生效请修改文件。已中奖结果仍保存在浏览器本地。':'未找到同目录的 lottery-data.json，当前使用浏览器本地数据。'}
setSrc(false);
function applyFile(d){
  const L=v=>Array.isArray(v)?v.join('\n'):(v||''),old=S.winners||{},seen={};
  const prizes=d.prizes.map((p,i)=>{let id=String(p.id||p.name||'p'+i);if(seen[id])id+='-'+i;seen[id]=1;
    return{id,name:p.name||('奖项'+(i+1)),count:Math.max(1,+p.count||1),order:p.order!=null?+p.order:i+1,list:L(p.list)}});
  const w={};
  if(d.winners&&typeof d.winners==='object'){for(const p of prizes)if(Array.isArray(d.winners[p.id]))w[p.id]=d.winners[p.id]}
  else for(const p of prizes)if(old[p.id])w[p.id]=old[p.id];
  S={title:d.title||S.title,pool:L(d.pool),fx:d.fx||S.fx,prizes,winners:w};
  save();setSrc(true);$('#title').value=S.title;document.title=S.title||'幸运抽奖';cur=null;
  renderDraw();if(!$('#v-set').classList.contains('hide'))renderSet();
}
fetch('lottery-data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.prizes))applyFile(d)}).catch(()=>{});
$('#export').onclick=()=>{
  const o={title:S.title,fx:mode(),pool:parse(S.pool),prizes:sorted().map(p=>({id:p.id,name:p.name,count:p.count,order:p.order,list:parse(p.list)}))};
  const t=JSON.stringify(o,null,2),ta=$('#exp');ta.value=t;ta.classList.remove('hide');ta.select();
  const done=ok=>$('#exp-msg').textContent=ok?'已复制，保存为 lottery-data.json 放到网页同目录即可':'请手动复制下方内容，保存为 lottery-data.json';
  try{navigator.clipboard.writeText(t).then(()=>done(true),()=>done(false))}catch(e){done(false)}
};
renderDraw();
</script>
